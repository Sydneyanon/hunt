  function kindOf(k) {
    var ok = { running:1, ok:1, done:1, queued:1, waiting:1, flagged:1, skipped:1, seen:1 };
    return ok[k] ? k : "waiting";
  }
  function chip(txt, kind) { return '<span class="chip k-' + kindOf(kind) + '">' + esc(txt) + "</span>"; }

  function tzOffsetMin() {
    var u = (DATA && DATA.updated_at) || "";
    var m = /([+-])(\d\d):(\d\d)$/.exec(u);
    if (!m) { return 660; }
    var v = parseInt(m[2], 10) * 60 + parseInt(m[3], 10);
    return m[1] === "-" ? -v : v;
  }
  function sydneyNow() {
    var d = new Date(new Date().getTime() + tzOffsetMin() * 60000);
    return DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONS[d.getUTCMonth()] + " " +
      pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()) + " AEDT";
  }
  function fit() {
    var w = window.innerWidth || document.documentElement.clientWidth || 1920;
    el("root").style.zoom = String(w / 1920);
  }

  function render() {
    if (!DATA) { return; }
    var i, h, html;

    html = "";
    var chips = DATA.chips || [];
    for (i = 0; i < chips.length; i++) { html += chip(chips[i].txt, chips[i].kind); }
    el("chips").innerHTML = html;

    var al = DATA.alert || {};
    if (al.active && al.count > 0) {
      el("alert").style.display = "block";
      el("alert-cnt").innerHTML = esc(al.label || (al.count + " under review"));
    } else {
      el("alert").style.display = "none";
      el("alert-cnt").innerHTML = "";
    }

    var nr = DATA.now_running || [];
    el("now").style.display = nr.length ? "block" : "none";
    var items = "";
    for (i = 0; i < nr.length; i++) {
      items += "<span>&#9679; <b>" + esc(nr[i].name) + "</b> &mdash; " + esc(nr[i].activity) + "</span>";
    }
    el("ticker").innerHTML = items + items;
    var per = 6, cards = '<table class="full fixed">';
    for (i = 0; i < nr.length; i++) {
      if (i % per === 0) { cards += (i ? "</tr>" : "") + '<tr>'; }
      var sc = nr[i].name === "Scout" ? " scout" : "";
      cards += '<td class="runcell"><div class="runcard' + sc + '" style="-webkit-animation-delay:' + (i * 0.3) + 's;animation-delay:' + (i * 0.3) + 's;">' +
        '<div class="rn">' + esc(nr[i].name) + '</div><div class="ra">' + esc(nr[i].activity) + "</div>" +
        '<div class="scan" style="-webkit-animation-delay:' + (i * 0.25) + 's;animation-delay:' + (i * 0.25) + 's;"></div></div></td>';
    }
    if (nr.length) {
      for (i = nr.length % per; i > 0 && i < per; i++) { cards += '<td class="runcell"></td>'; }
      cards += "</tr>";
    }
    el("runcards").innerHTML = cards + "</table>";

    renderScout();

    html = "";
    var hs = DATA.hunts || [];
    for (i = 0; i < hs.length; i++) {
      h = hs[i];
      var p = bound(parseInt(h.pct, 10) || 0, 0, 100);
      html += "<tr><td class=\"nm t-" + kindOf(h.kind) + "\">" + esc(h.name) + "</td><td>" + esc(h.platform) +
        "</td><td>" + esc(h.stage) + "</td><td>" + esc(h.activity) + "</td>" +
        '<td><table class="full"><tr><td style="padding:0;border:0;width:75%;"><div class="bar"><i style="width:' + p + '%;"></i></div></td>' +
        '<td style="padding:0 0 0 10px;border:0;" class="pct">' + p + "%</td></tr></table></td>" +
        "<td>" + chip(h.status, h.kind) + "</td></tr>";
    }
    el("hunts").innerHTML = html;
    renderClock();
  }


  var scanIdx = 0;
  function scoutData() { return (DATA && DATA.scout_search) || {}; }
  function renderScout() {
    var sc = scoutData(), i, html = "";
    var nw = sc.newest || [];
    html = '<table class="full fixed"><tr><td style="vertical-align:top;padding-right:8px;width:56%;">';
    for (i = 0; i < nw.length; i++) {
      if (i === 3) { html += '</td><td style="vertical-align:top;">'; }
      html += '<div class="nf"><b>' + esc(nw[i].name) + "</b> <i>" + esc(nw[i].platform) + "</i></div>";
    }
    el("newest").innerHTML = html + "</td></tr></table>";
    html = "";
    var nl = sc.next_in_line || [];
    for (i = 0; i < nl.length; i++) {
      html += '<div class="nf"><i>' + esc(nl[i].track) + "</i> <b>" + esc(nl[i].name) + "</b></div>";
    }
    el("nil").innerHTML = html;
    var st = DATA.stats || [], tsk = "";
    for (i = 0; i < st.length; i++) {
      if (/TSK/.test(st[i].label)) { tsk = st[i].label + " " + st[i].value; }
    }
    el("to-tsk").innerHTML = esc(tsk);
    el("sweep-last").innerHTML = shortTime(sc.last_sweep_at) ? esc(shortTime(sc.last_sweep_at)) : "&mdash;";
    tickScan();
  }
  function shortTime(iso) {
    var t = iso ? Date.parse(iso) : NaN;
    if (isNaN(t)) { return ""; }
    var d = new Date(t + tzOffsetMin() * 60000);
    var h = d.getUTCHours(), ap = h < 12 ? "am" : "pm";
    var h12 = h % 12; if (h12 === 0) { h12 = 12; }
    return h12 + ":" + pad(d.getUTCMinutes()) + ap + " AEDT";
  }
  function nextSweepText() {
    var off = tzOffsetMin() * 60000;
    var nowMs = new Date().getTime();
    var d = new Date(nowMs + off);
    var h = d.getUTCHours();
    var win = scoutData().window || [7, 23];
    var target = new Date(nowMs + off);
    target.setUTCMinutes(0, 0, 0);
    if (h < win[0]) { target.setUTCHours(win[0]); }
    else if (h >= win[1]) { target.setUTCDate(target.getUTCDate() + 1); target.setUTCHours(win[0]); }
    else { target.setUTCHours(h + 1); }
    var left = Math.floor((target.getTime() - (nowMs + off)) / 1000);
    if (left < 0) { left = 0; }
    var th = target.getUTCHours(), ap = th < 12 ? "am" : "pm", t12 = th % 12; if (t12 === 0) { t12 = 12; }
    var lh = Math.floor(left / 3600), lm = Math.floor((left % 3600) / 60), ls = left % 60;
    return t12 + ":00" + ap + " &middot; in " + (lh ? lh + "h " : "") + pad(lm) + ":" + pad(ls);
  }
  function tickScan() {
    var pl = scoutData().platforms || [];
    if (!pl.length) { return; }
    var cur = scanIdx % pl.length, i, html = "";
    for (i = 0; i < pl.length; i++) {
      html += '<span class="' + (i === cur ? "on" : (i < cur ? "done" : "")) + '">' + esc(pl[i]) + "</span> ";
    }
    el("scan-plats").innerHTML = html;
    el("scan-now").innerHTML = esc(String(pl[cur]).toUpperCase());
  }
  function stepScan() { scanIdx += 1; tickScan(); }

  function renderClock() {
    if (!DATA) { return; }
    el("clock").innerHTML = esc(sydneyNow());
    el("sweep-next").innerHTML = nextSweepText();
    var now = new Date().getTime();
    var cs = DATA.contests || [], html = "", i;
    for (i = 0; i < cs.length; i++) {
      var c = cs[i];
      var end = c.end ? Date.parse(c.end) : NaN;
      var open = c.open ? Date.parse(c.open) : NaN;
      var left = "";
      if (c.standing) { left = "standing"; }
      else if (!isNaN(end) && now >= end) { left = "closed"; }
      else if (!isNaN(open) && now < open) { left = "opens in " + dur(open - now); }
      else if (!isNaN(end)) { left = dur(end - now); }
      html += "<tr><td class=\"nm t-" + kindOf(c.kind) + "\">" + esc(c.name) + "</td><td>" + esc(c.platform) +
        "</td><td class=\"wrap\" style=\"font-size:19px;\">" + esc(c.pays) + '</td><td class="cd t-' + kindOf(c.kind) + '">' + esc(left) +
        "</td><td>" + chip(c.status, c.kind) + "</td></tr>";
    }
    el("contests").innerHTML = html;
    el("foot").innerHTML = "STATUS ONLY &middot; NO DETAILS &middot; LAST UPDATED " + esc(DATA.updated_label || "") + " &middot; SYDNEY TIME";
  }
  function dur(ms) {
    var s = Math.floor(ms / 1000);
    if (s < 0) { s = 0; }
    return Math.floor(s / 86400) + "d " + pad(Math.floor((s % 86400) / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
  }

  function flip() {
    page = page ? 0 : 1;
    el("pg-hunts").style.display = page ? "none" : "block";
    el("pg-contests").style.display = page ? "block" : "none";
  }

  function load() {
    var x;
    try { x = new XMLHttpRequest(); } catch (e) { return; }
    x.open("GET", "status.json?t=" + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) {
        try { DATA = JSON.parse(x.responseText); render(); } catch (e2) { }
      }
    };
    x.send(null);
  }


  /* ----- radar (canvas 2D, ES5, setInterval) ----- */
  var BG = "#03050b", CY = "#22d3ee", AM = "#ffb020", MG = "#ff3d81", LM = "#5cff9d", VI = "#a78bfa", TX = "#d8ecff", DIM = "#9fb3cc";
  var KCOL = { running: AM, waiting: CY, queued: VI, flagged: MG, done: LM, ok: LM, skipped: DIM, seen: DIM };
  var DEFAULT_PLATS = ["Sherlock","Immunefi","Cantina","Code4rena","CodeHawks","Guardian","HackenProof","X"];
  var cv = el("radar");
  var ctx = null;
  try { ctx = cv && cv.getContext ? cv.getContext("2d") : null; } catch (e3) { ctx = null; }
  var t0 = new Date().getTime();
  function rgbaHex(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function platPos(cx, cy, R, k, rf, da) {
    var a = -Math.PI / 2 + (k * Math.PI) / 4 + (da || 0);
    return { x: cx + Math.cos(a) * R * rf, y: cy + Math.sin(a) * R * rf };
  }
  function drawRadar() {
    if (!ctx) { return; }
    var ta = (new Date().getTime() - t0) / 1000;
    var W = 466, H = 392, cx = 233, cy = 180, R = 150;
    var TWO = Math.PI * 2;
    var sw = (ta * 1.35) % TWO;
    var i, k, a, p, g;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    rg.addColorStop(0, "rgba(34,211,238,0.12)");
    rg.addColorStop(1, "rgba(34,211,238,0.02)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, TWO); ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(34,211,238,0.30)";
    for (k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 3, 0, TWO); ctx.stroke(); }
    ctx.strokeStyle = "rgba(34,211,238,0.13)";
    ctx.beginPath();
    for (k = 0; k < 4; k++) {
      a = (k * Math.PI) / 4;
      ctx.moveTo(cx - Math.cos(a) * R, cy - Math.sin(a) * R);
      ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    }
    ctx.stroke();
    ctx.strokeStyle = "rgba(34,211,238,0.40)";
    ctx.beginPath();
    for (k = 0; k < 72; k++) {
      a = (k * Math.PI) / 36;
      var l = (k % 6 === 0) ? 8 : 4;
      ctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.lineTo(cx + Math.cos(a) * (R + l), cy + Math.sin(a) * (R + l));
    }
    ctx.stroke();
    for (k = 0; k < 24; k++) {
      ctx.fillStyle = "rgba(34,211,238," + (0.30 * (1 - k / 24)) + ")";
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, sw - (k + 1) * 0.05, sw - k * 0.05, false);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = "rgba(170,250,255,0.95)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(sw) * R, cy + Math.sin(sw) * R); ctx.stroke();
    ctx.lineWidth = 1;

    function glowAt(pt) {
      var ang = Math.atan2(pt.y - cy, pt.x - cx);
      var d = (sw - ang) % TWO;
      if (d < 0) { d += TWO; }
      return Math.exp(-d * 1.4);
    }
    var plats = (DATA && DATA.platforms && DATA.platforms.length) ? DATA.platforms : DEFAULT_PLATS;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (i = 0; i < plats.length && i < 8; i++) {
      p = platPos(cx, cy, R, i, 0.86, 0);
      g = glowAt(p);
      ctx.fillStyle = rgbaHex(VI, 0.35 + 0.65 * g);
      ctx.beginPath(); ctx.arc(p.x, p.y, 5 + 2 * g, 0, TWO); ctx.fill();
      ctx.strokeStyle = rgbaHex(VI, 0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, 9 + 3 * g, 0, TWO); ctx.stroke();
      ctx.font = "12px monospace";
      ctx.fillStyle = "rgba(216,236,255," + (0.5 + 0.5 * g) + ")";
      ctx.fillText(String(plats[i]).toUpperCase(), p.x, p.y + 18);
    }
    var blips = (DATA && DATA.blips) || [];
    for (i = 0; i < blips.length; i++) {
      var b = blips[i];
      p = platPos(cx, cy, R, b.plat || 0, b.dr || 0.6, b.da || 0);
      g = glowAt(p);
      var col = KCOL[b.kind] || CY;
      var pulse = b.kind === "running" || b.kind === "waiting" || b.kind === "flagged";
      ctx.fillStyle = rgbaHex(col, 0.55 + 0.45 * g);
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 2 * g, 0, TWO); ctx.fill();
      if (pulse) {
        var ph = (ta * 0.9 + i * 0.37) % 1;
        ctx.strokeStyle = rgbaHex(col, 0.75 * (1 - ph));
        ctx.beginPath(); ctx.arc(p.x, p.y, 5 + ph * 18, 0, TWO); ctx.stroke();
      }
      ctx.textAlign = p.x < cx ? "right" : "left";
      ctx.font = "13px monospace";
      ctx.fillStyle = "rgba(230,244,255," + (0.55 + 0.45 * g) + ")";
      ctx.fillText(String(b.name || ""), p.x + (p.x < cx ? -9 : 9), p.y);
    }
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ta * 0.8);
    ctx.strokeStyle = CY; ctx.lineWidth = 1.5; ctx.beginPath();
    for (k = 0; k < 6; k++) {
      a = (k * Math.PI) / 3;
      if (k === 0) { ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12); } else { ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); }
    }
    ctx.closePath(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#bdf6ff";
    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, TWO); ctx.fill();
    ctx.lineWidth = 1;
    ctx.textAlign = "center";
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = TX;
    ctx.fillText("SCOUT", cx, H - 34);
    ctx.font = "13px monospace";
    ctx.fillStyle = DIM;
    var hrs = (DATA && DATA.scout && DATA.scout.hours) || "07:00-23:00 AEDT";
    ctx.fillText("HOURLY SWEEP \u00b7 " + hrs, cx, H - 14);
  }

  el("pg1").innerHTML = "1 / 2";
  el("pg2").innerHTML = "2 / 2";
  fit();
  window.onresize = fit;
  render();
  setInterval(renderClock, 1000);
  setInterval(flip, 20000);
  setInterval(load, 60000);
  drawRadar();
  setInterval(drawRadar, 40);
  setInterval(stepScan, 900);
})();
</script>
</body>
</html>
