        '<div class="meta"><span class="t-' + kindOf(h.kind) + '">' + esc(h.status) + "</span> &middot; " + esc(h.platform) + "</div>" +
        '<div class="now"><b>NOW</b> ' + esc(nw) + "</div>" +
        '<div class="bar"><i class="' + (p >= 100 ? "full" : "") + '" style="width:' + (noPct ? 0 : p) + '%;"></i></div>' +
        '<div class="gates">' + gh + "</div></div>";
    }
    el("hunts").innerHTML = html;
    renderClock();
    setTimeout(fit, 50);
  }

  var scanIdx = 0;
  function scoutData() { return (DATA && DATA.scout_search) || {}; }
  function renderScout() {
    var sc = scoutData(), i, html = "";
    var nw = sc.newest || [];
    for (i = 0; i < nw.length; i++) {
      html += '<div class="nf"><b>' + esc(nw[i].name) + "</b> <i>" + esc(nw[i].platform) + "</i></div>";
    }
    el("newest").innerHTML = html || "&mdash;";
    html = "";
    var nl = sc.next_in_line || [];
    for (i = 0; i < nl.length; i++) {
      html += '<div class="nf"><i>' + esc(nl[i].track) + "</i> <b>" + esc(nl[i].name) + "</b></div>";
    }
    el("nil").innerHTML = html || "&mdash;";
    var st = DATA.stats || [], tsk = "";
    for (i = 0; i < st.length; i++) {
      if (/TSK/.test(st[i].label)) { tsk = st[i].label + " " + st[i].value; }
    }
    el("to-tsk").innerHTML = esc(tsk);
    el("sweep-last").innerHTML = shortTime(sc.last_sweep_at) ? esc(shortTime(sc.last_sweep_at)) : "&mdash;";
    tickScan();
  }
  function nextSweep() {
    var off = tzOffsetMin() * 60000;
    var nowMs = new Date().getTime();
    var d = new Date(nowMs + off);
    var h = d.getUTCHours();
    var win = scoutData().window || [7, 23];
    var target = new Date(nowMs + off);
    target.setUTCMinutes(0, 0, 0);
    if (h < win[0]) { target.setUTCHours(win[0]); }
    else if (h >= win[1]) { target.setUTCDate(target.getUTCDate() + 1); target.setUTCHours(win[0]); }
    else { target.setUTCHours(h + 1); }
    var left = Math.floor((target.getTime() - (nowMs + off)) / 1000);
    if (left < 0) { left = 0; }
    var th = target.getUTCHours(), ap = th < 12 ? "am" : "pm", t12 = th % 12; if (t12 === 0) { t12 = 12; }
    return { at: t12 + ":00" + ap, h: Math.floor(left / 3600), m: Math.floor((left % 3600) / 60), s: left % 60 };
  }
  function tickScan() {
    var pl = scoutData().platforms || [];
    if (!pl.length) { return; }
    var cur = scanIdx % pl.length, i, html = "";
    for (i = 0; i < pl.length; i++) {
      html += '<span class="' + (i === cur ? "on" : (i < cur ? "done" : "")) + '">' + esc(pl[i]) + "</span> ";
    }
    el("scan-plats").innerHTML = html;
    el("scan-now").innerHTML = esc(String(pl[cur]).toUpperCase());
  }
  function stepScan() { scanIdx += 1; tickScan(); }
  function boxes(ms, withDays) {
    var s = Math.floor(ms / 1000); if (s < 0) { s = 0; }
    var d = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    return (withDays ? '<span class="cdbox">' + pad(d) + "</span>" : "") + '<span class="cdbox">' + pad(hh) + '</span><span class="cdbox">' + pad(mm) +
      '</span><span class="cdbox">' + pad(ss) + "</span>";
  }

  function renderClock() {
    if (!DATA) { return; }
    var now = new Date().getTime(), i;
    el("clock").innerHTML = esc(sydneyNow()) + " &middot; data " + esc(shortTime(DATA.updated_at));
    ageText();
    var ns = nextSweep();
    el("sweep-at").innerHTML = "&middot; " + ns.at;
    el("sweep-next").innerHTML = '<span class="cdbox">' + pad(ns.h) + '</span><span class="cdbox">' + pad(ns.m) + '</span><span class="cdbox">' + pad(ns.s) + "</span>";
    var cards = (DATA.live && DATA.live.cards) || [];
    for (i = 0; i < cards.length; i++) {
      var r = el("rt" + i);
      if (!r) { continue; }
      var t = parseIso(cards[i].since);
      if (!isNaN(t)) { r.innerHTML = "running " + mins(now - t); }
      else if (cards[i].kind === "scout") { r.innerHTML = "next " + ns.at; }
      else { r.innerHTML = ""; }
    }
    var cs = DATA.contests || [], html = "";
    for (i = 0; i < cs.length; i++) {
      var c = cs[i];
      var end = parseIso(c.end), open = parseIso(c.open), lab = "", cd = "";
      if (c.standing) { lab = "STANDING BOUNTY"; cd = '<span class="cdbox" style="font-size:16px;">always open</span>'; }
      else if (!isNaN(end) && now >= end) { lab = "CLOSED"; cd = '<span class="cdbox" style="font-size:16px;">ended</span>'; }
      else if (!isNaN(open) && now < open) { lab = "OPENS IN &middot; D H M S"; cd = boxes(open - now, true); }
      else if (!isNaN(end)) { lab = "ENDS IN &middot; D H M S"; cd = boxes(end - now, true); }
      else { lab = "DATES"; cd = '<span class="cdbox" style="font-size:16px;">tbc</span>'; }
      html += '<div class="hcard ccard' + ((i % 5) === 4 ? " last" : "") + '" style="width:18.6%;">' +
        '<div class="nm t-' + kindOf(c.kind) + '">' + esc(c.name) + "</div>" +
        '<div class="meta">' + esc(c.platform) + "</div>" +
        '<div class="pays">' + esc(c.pays) + "</div>" +
        '<div class="cdl">' + lab + '</div><div class="cds">' + cd + "</div>" + chip(c.status, c.kind) + "</div>";
    }
    el("contests").innerHTML = html;
    el("foot").innerHTML = "STATUS ONLY &middot; NO DETAILS &middot; LAST UPDATED " + esc(DATA.updated_label || "") + " &middot; SYDNEY TIME";
  }

  function flip() {
    if (isNarrow()) { el("pg-hunts").style.display = "block"; el("pg-contests").style.display = "block"; return; }
    page = page ? 0 : 1;
    el("pg-hunts").style.display = page ? "none" : "block";
    el("pg-contests").style.display = page ? "block" : "none";
    fit();
  }

  function load() {
    var x;
    try { x = new XMLHttpRequest(); } catch (e) { return; }
    x.open("GET", "status.json?t=" + new Date().getTime() + "_" + Math.floor(Math.random() * 1e6), true);
    try { x.setRequestHeader("Cache-Control", "no-cache"); } catch (e4) { }
    x.onreadystatechange = function () {
      if (x.readyState === 4 && x.status === 200) {
        try { DATA = JSON.parse(x.responseText); render(); checkBuild(); } catch (e2) { }
      }
    };
    x.send(null);
  }

  /* ----- radar (canvas 2D, ES5; static layer cached, rAF ~30fps, paused when hidden) ----- */
  var BG = "#0a1020", CY = "#22d3ee", AM = "#ffb020", MG = "#ff3d81", LM = "#5cff9d", VI = "#a78bfa", TX = "#d8ecff", DIM = "#9fb3cc", OR = "#ff8a3d";
  var KCOL = { running: AM, waiting: CY, queued: VI, flagged: MG, done: LM, ok: LM, skipped: DIM, seen: DIM, stalled: OR };
  var DEFAULT_PLATS = ["Sherlock","Immunefi","Cantina","Code4rena","CodeHawks","Guardian","HackenProof","X"];
  var RW = 466, RH = 392, RCX = 233, RCY = 176, RR = 148, TWO = Math.PI * 2;
  var cv = el("radar");
  var ctx = null, bgc = null, bgx = null, RS = 1, bgKey = "";
  try { ctx = cv && cv.getContext ? cv.getContext("2d") : null; } catch (e3) { ctx = null; }
  var t0 = new Date().getTime();
  function rgbaHex(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function platPos(k, rf, da) {
    var a = -Math.PI / 2 + (k * Math.PI) / 4 + (da || 0);
    return { x: RCX + Math.cos(a) * RR * rf, y: RCY + Math.sin(a) * RR * rf, a: a };
  }
  function sizeRadar() {
    if (!ctx) { return; }
    var dpr = window.devicePixelRatio || 1;
    if (dpr > 2) { dpr = 2; }
    var cssW = 620;
    if (isNarrow()) {
      cssW = (cv.parentNode && cv.parentNode.clientWidth ? cv.parentNode.clientWidth : 360) - 14;
      if (cssW < 200) { cssW = 200; }
    } else { dpr = 1; }
    var cssH = Math.round(cssW * RH / RW);
    var bw = Math.round(cssW * dpr), bh = Math.round(cssH * dpr);
    if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
    cv.style.width = cssW + "px";
    cv.style.height = cssH + "px";
    RS = bw / RW;
    bgKey = "";
  }
  function plats() { return (DATA && DATA.platforms && DATA.platforms.length) ? DATA.platforms : DEFAULT_PLATS; }
  function buildBg() {
    var key = cv.width + "x" + cv.height + ":" + plats().join(",");
    if (key === bgKey && bgc) { return; }
    bgKey = key;
    bgc = document.createElement("canvas");
    bgc.width = cv.width; bgc.height = cv.height;
    bgx = bgc.getContext("2d");
    var c = bgx, k, a, i, p;
    c.setTransform(RS, 0, 0, RS, 0, 0);
    c.fillStyle = BG; c.fillRect(0, 0, RW, RH);
    var rg = c.createRadialGradient(RCX, RCY, 0, RCX, RCY, RR);
    rg.addColorStop(0, "rgba(34,211,238,0.12)"); rg.addColorStop(1, "rgba(34,211,238,0.02)");
    c.fillStyle = rg; c.beginPath(); c.arc(RCX, RCY, RR, 0, TWO); c.fill();
    c.lineWidth = 1; c.strokeStyle = "rgba(34,211,238,0.30)";
    for (k = 1; k <= 3; k++) { c.beginPath(); c.arc(RCX, RCY, RR * k / 3, 0, TWO); c.stroke(); }
    c.strokeStyle = "rgba(34,211,238,0.13)"; c.beginPath();
    for (k = 0; k < 4; k++) {
      a = (k * Math.PI) / 4;
      c.moveTo(RCX - Math.cos(a) * RR, RCY - Math.sin(a) * RR); c.lineTo(RCX + Math.cos(a) * RR, RCY + Math.sin(a) * RR);
    }
    c.stroke();
    c.strokeStyle = "rgba(34,211,238,0.40)"; c.beginPath();
    for (k = 0; k < 72; k++) {
      a = (k * Math.PI) / 36;
      var l = (k % 6 === 0) ? 8 : 4;
      c.moveTo(RCX + Math.cos(a) * RR, RCY + Math.sin(a) * RR); c.lineTo(RCX + Math.cos(a) * (RR + l), RCY + Math.sin(a) * (RR + l));
    }
    c.stroke();
    var pl = plats();
    c.textAlign = "center"; c.textBaseline = "middle"; c.font = "12px monospace";
    for (i = 0; i < pl.length && i < 8; i++) {
      p = platPos(i, 0.86, 0);
      c.strokeStyle = rgbaHex(VI, 0.45); c.beginPath(); c.arc(p.x, p.y, 9, 0, TWO); c.stroke();
      c.fillStyle = "rgba(216,236,255,0.55)"; c.fillText(String(pl[i]).toUpperCase(), p.x, p.y + 18);
    }
  }
  function liveNames() {
    var out = [], hs = (DATA && DATA.hunts) || [], i;
    for (i = 0; i < hs.length; i++) { if (hs[i].kind === "running" || hs[i].kind === "stalled") { out.push(hs[i].name); } }
    return out;
  }
  function drawRadar() {
    if (!ctx) { return; }
    buildBg();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgc, 0, 0);
    ctx.setTransform(RS, 0, 0, RS, 0, 0);
    var ta = (new Date().getTime() - t0) / 1000;
    var sw = (ta * 1.35) % TWO;
    var i, k, p, g;
    for (k = 0; k < 12; k++) {
      ctx.fillStyle = "rgba(34,211,238," + (0.30 * (1 - k / 12)) + ")";
      ctx.beginPath(); ctx.moveTo(RCX, RCY);
      ctx.arc(RCX, RCY, RR, sw - (k + 1) * 0.1, sw - k * 0.1, false);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = "rgba(170,250,255,0.95)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(RCX, RCY); ctx.lineTo(RCX + Math.cos(sw) * RR, RCY + Math.sin(sw) * RR); ctx.stroke();
    ctx.lineWidth = 1;
    function glowAt(pt) {
      var d = (sw - Math.atan2(pt.y - RCY, pt.x - RCX)) % TWO;
      if (d < 0) { d += TWO; }
      return Math.exp(-d * 1.4);
    }
    var pl = plats();
    for (i = 0; i < pl.length && i < 8; i++) {
      p = platPos(i, 0.86, 0); g = glowAt(p);
      ctx.fillStyle = rgbaHex(VI, 0.35 + 0.65 * g);
      ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 3 * g, 0, TWO); ctx.fill();
    }
    var blips = (DATA && DATA.blips) || [];
    ctx.textBaseline = "middle";
    /* quiet blips first, live ones on top */
    var pass, live;
    for (pass = 0; pass < 2; pass++) {
      for (i = 0; i < blips.length; i++) {
        var b = blips[i];
        live = b.kind === "running" || b.kind === "stalled" || b.kind === "flagged" || b.kind === "waiting";
        if ((pass === 0) === live) { continue; }
        p = platPos(b.plat || 0, b.dr || 0.6, b.da || 0); g = glowAt(p);
        var col = KCOL[b.kind] || CY;
        var quiet = b.kind === "done" || b.kind === "skipped" || b.kind === "seen";
        ctx.fillStyle = rgbaHex(col, quiet ? 0.25 + 0.35 * g : 0.6 + 0.4 * g);
        ctx.beginPath(); ctx.arc(p.x, p.y, quiet ? 3 : 4 + 2 * g, 0, TWO); ctx.fill();
        if (live) {
          var spd = b.kind === "running" ? 0.9 : 0.45;
          var ph = (ta * spd + i * 0.37) % 1;
          ctx.strokeStyle = rgbaHex(col, 0.8 * (1 - ph));
          ctx.beginPath(); ctx.arc(p.x, p.y, 5 + ph * 18, 0, TWO); ctx.stroke();
          if (g > 0.5) { ctx.strokeStyle = rgbaHex(col, g); ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, TWO); ctx.stroke(); }
        }
        var left = p.x < RCX;
        ctx.textAlign = left ? "right" : "left";
        ctx.font = live ? "bold 13px monospace" : "12px monospace";
        ctx.fillStyle = quiet ? "rgba(159,179,204," + (0.35 + 0.35 * g) + ")" : "rgba(235,246,255," + (0.7 + 0.3 * g) + ")";
        ctx.fillText(String(b.name || ""), p.x + (left ? -9 : 9), p.y);
      }
    }
    ctx.save(); ctx.translate(RCX, RCY); ctx.rotate(ta * 0.8);
    ctx.strokeStyle = CY; ctx.lineWidth = 1.5; ctx.beginPath();
    for (k = 0; k < 6; k++) {
      var a6 = (k * Math.PI) / 3;
      if (k === 0) { ctx.moveTo(Math.cos(a6) * 12, Math.sin(a6) * 12); } else { ctx.lineTo(Math.cos(a6) * 12, Math.sin(a6) * 12); }
    }
    ctx.closePath(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#bdf6ff"; ctx.beginPath(); ctx.arc(RCX, RCY, 4, 0, TWO); ctx.fill();
    ctx.lineWidth = 1; ctx.textAlign = "center";
    ctx.font = "bold 14px monospace"; ctx.fillStyle = TX;
    ctx.fillText("SCOUT \u00b7 HOURLY SWEEP " + ((DATA && DATA.scout && DATA.scout.hours) || "07:00-23:00 AEDT"), RCX, RH - 38);
    var ln = liveNames();
    ctx.font = "13px monospace"; ctx.fillStyle = AM;
    ctx.fillText(ln.length ? "LIVE: " + ln.join(" \u00b7 ") : "NO HUNT RUNNING", RCX, RH - 18);
  }
  var rafFn = window.requestAnimationFrame || window.webkitRequestAnimationFrame || null;
  var lastDraw = 0;
  function frame() {
    var n = new Date().getTime();
    if (!document.hidden && n - lastDraw >= 33) { lastDraw = n; drawRadar(); }
    rafFn.call(window, frame);
  }

  /* ----- freshness: cache-busted data, build stamp reload, age badge ----- */
  var BUILD = DATA && DATA.build ? DATA.build : "";
  function checkBuild() {
    if (DATA && DATA.build && BUILD && DATA.build !== BUILD) {
      var tag = "v=" + encodeURIComponent(DATA.build);
      if (String(window.location.search).indexOf(tag) >= 0) { return; } /* already tried this build; avoid loops on a stale CDN copy */
      window.location.replace(window.location.pathname + "?" + tag);
    }
  }
  function ageText() {
    var t = DATA ? parseIso(DATA.updated_at) : NaN;
    var b = el("age");
    if (!b) { return; }
    if (isNaN(t)) { b.innerHTML = ""; return; }
    var m = Math.floor((new Date().getTime() - t) / 60000);
    if (m < 0) { m = 0; }
    b.innerHTML = "UPDATED " + (m < 1 ? "JUST NOW" : m + " MIN AGO");
    b.className = "chip " + (m > 30 ? "k-flagged" : (m > 10 ? "k-running" : "k-ok"));
  }
  function onVisible() { if (!document.hidden) { load(); } }
  if (document.addEventListener) { document.addEventListener("visibilitychange", onVisible, false); }
  window.onpageshow = function (ev) { if (ev && ev.persisted) { load(); } };

  el("pg1").innerHTML = "1 / 2 &middot; rotates";
  el("pg2").innerHTML = "2 / 2";
  render();
  if (isNarrow()) { el("pg-contests").style.display = "block"; }
  fit();
  window.onresize = function () { fit(); sizeRadar(); };
  setInterval(renderClock, 1000);
  setInterval(flip, 20000);
  setInterval(load, 60000);
  sizeRadar();
  drawRadar();
  if (rafFn) { rafFn.call(window, frame); } else { setInterval(function () { if (!document.hidden) { drawRadar(); } }, 50); }
  setInterval(ageText, 15000);
  setTimeout(load, 3000);
  setInterval(stepScan, 900);
})();
</script>
</body>
</html>
